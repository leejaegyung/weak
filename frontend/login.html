<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — 주간업무보고</title>
  <link rel="stylesheet" href="/css/style.css?v=2" />
  <style>
    .auth-tabs {
      display: flex;
      border: 2px solid var(--ink);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 22px;
    }
    .auth-tab {
      flex: 1;
      padding: 9px 0;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      background: var(--cream-dark);
      color: var(--ink-muted);
      border: none;
      transition: background .15s, color .15s;
    }
    .auth-tab.active {
      background: var(--ink);
      color: #fff;
    }
    .auth-tab:first-child { border-right: 2px solid var(--ink); }

    .auth-panel { display: none; }
    .auth-panel.active { display: block; }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
      color: var(--ink-light);
      font-size: 12px;
      font-weight: 600;
    }
    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(26,17,0,0.15);
    }

    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 11px 16px;
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 10px;
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      transition: box-shadow .15s, transform .15s;
      text-decoration: none;
    }
    .btn-google:hover {
      box-shadow: 4px 4px 0 var(--ink);
      transform: translate(-1px,-1px);
    }
    .btn-google:active {
      box-shadow: 1px 1px 0 var(--ink);
      transform: translate(2px,2px);
    }

    .google-note {
      margin-top: 10px;
      font-size: 11px;
      color: var(--ink-light);
      text-align: center;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .input-hint {
      font-size: 11px;
      color: var(--ink-muted);
      margin-top: 4px;
    }

    .login-card { width: 400px; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
        <div style="width:36px;height:36px;background:var(--orange);border:2px solid var(--ink);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;">📋</div>
        <div class="login-logo">주간업무보고</div>
      </div>
      <div class="login-sub" id="page-sub">팀 계정으로 로그인하세요</div>

      <div class="login-error" id="login-error"></div>

      <!-- 탭 -->
      <div class="auth-tabs" style="margin-top:18px;">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">로그인</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">회원가입</button>
      </div>

      <!-- 로그인 패널 -->
      <div class="auth-panel active" id="panel-login">
        <form id="login-form">
          <div class="form-group">
            <label class="form-label">아이디</label>
            <input class="form-input" type="text" id="username" placeholder="아이디 입력" autofocus />
          </div>
          <div class="form-group" style="margin-bottom:20px;">
            <label class="form-label">비밀번호</label>
            <input class="form-input" type="password" id="password" placeholder="비밀번호 입력" />
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%;">로그인</button>
        </form>

        <div id="google-login-section" style="display:none;">
          <div class="login-divider">또는</div>
          <a href="/api/auth/google/login" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 18 18">
              <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
              <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
              <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/>
            </svg>
            Google 계정으로 로그인
          </a>
          <div class="google-note">처음 로그인하면 자동으로 계정이 생성됩니다</div>
        </div>
      </div>

      <!-- 회원가입 패널 -->
      <div class="auth-panel" id="panel-register">
        <form id="register-form">
          <div class="form-row" style="margin-bottom:12px;">
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label">이름 <span style="color:var(--orange);">*</span></label>
              <input class="form-input" type="text" id="reg-name" placeholder="홍길동" />
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label">직책</label>
              <input class="form-input" type="text" id="reg-position" placeholder="사원" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">아이디 <span style="color:var(--orange);">*</span></label>
            <input class="form-input" type="text" id="reg-username" placeholder="영문/숫자 2자 이상" autocomplete="username" />
            <div class="input-hint">로그인에 사용할 아이디입니다</div>
          </div>
          <div class="form-row" style="margin-bottom:20px;">
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label">비밀번호 <span style="color:var(--orange);">*</span></label>
              <input class="form-input" type="password" id="reg-password" placeholder="4자 이상" autocomplete="new-password" />
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label">비밀번호 확인 <span style="color:var(--orange);">*</span></label>
              <input class="form-input" type="password" id="reg-password2" placeholder="동일하게 입력" autocomplete="new-password" />
            </div>
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%;">가입하기</button>
        </form>

        <div id="google-register-section" style="display:none;">
          <div class="login-divider">또는</div>
          <a href="/api/auth/google/login" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 18 18">
              <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
              <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
              <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/>
            </svg>
            Google 계정으로 가입하기
          </a>
          <div class="google-note">Google 계정 정보로 자동으로 가입됩니다</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { saveSession, isLoggedIn } from '/js/auth.js';
    import { api } from '/js/api.js';

    // 구글 콜백: ?token=... 처리
    const params = new URLSearchParams(location.search);
    const tokenParam = params.get('token');
    if (tokenParam) {
      const uname = params.get('uname') || '';
      const role  = params.get('role')  || 'member';
      saveSession(tokenParam, { name: uname, role });
      location.replace('/index.html');
    }

    if (isLoggedIn()) location.href = '/index.html';

    // 에러 파라미터 표시
    const errorMap = {
      google_not_configured: 'Google 로그인이 설정되지 않았습니다',
      no_code: 'Google 인증 코드를 받지 못했습니다',
      invalid_state: '보안 오류: 다시 시도해 주세요',
      google_failed: 'Google 인증에 실패했습니다',
      no_email: 'Google 계정에서 이메일을 가져오지 못했습니다',
      inactive: '비활성화된 계정입니다. 관리자에게 문의하세요',
    };
    const errParam = params.get('error');
    if (errParam) {
      showError(errorMap[errParam] || `오류: ${errParam}`);
    }

    // tab 파라미터로 초기 탭 결정
    if (params.get('tab') === 'register') {
      switchTab('register');
    }

    // Google 버튼 표시 여부
    fetch('/api/auth/google/status').then(r => r.json()).then(d => {
      if (d.enabled) {
        document.getElementById('google-login-section').style.display = 'block';
        document.getElementById('google-register-section').style.display = 'block';
      }
    }).catch(() => {});

    // 탭 전환
    window.switchTab = function(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('panel-login').classList.toggle('active', tab === 'login');
      document.getElementById('panel-register').classList.toggle('active', tab === 'register');
      document.getElementById('page-sub').textContent =
        tab === 'login' ? '팀 계정으로 로그인하세요' : '새 계정을 만들어 팀에 합류하세요';
      hideError();
    };

    function showError(msg) {
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError() {
      const el = document.getElementById('login-error');
      el.style.display = 'none';
    }

    // 로그인
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { showError('아이디와 비밀번호를 입력하세요'); return; }
      try {
        const data = await api.login({ username, password });
        saveSession(data.access_token, data.user);
        location.href = '/index.html';
      } catch (err) {
        showError(err.message);
      }
    });

    // 회원가입
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const name      = document.getElementById('reg-name').value.trim();
      const position  = document.getElementById('reg-position').value.trim() || '사원';
      const username  = document.getElementById('reg-username').value.trim();
      const password  = document.getElementById('reg-password').value;
      const password2 = document.getElementById('reg-password2').value;

      if (!name)     { showError('이름을 입력하세요'); return; }
      if (!username) { showError('아이디를 입력하세요'); return; }
      if (username.length < 2) { showError('아이디는 2자 이상이어야 합니다'); return; }
      if (!password) { showError('비밀번호를 입력하세요'); return; }
      if (password.length < 4) { showError('비밀번호는 4자 이상이어야 합니다'); return; }
      if (password !== password2) { showError('비밀번호가 일치하지 않습니다'); return; }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, position, username, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '회원가입 실패');
        saveSession(data.access_token, data.user);
        location.href = '/index.html';
      } catch (err) {
        showError(err.message);
      }
    });
  </script>
</body>
</html>
