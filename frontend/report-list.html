<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>보고서 목록 — 주간업무보고</title>
  <link rel="stylesheet" href="/css/style.css?v=2" />
  <style>
    /* 통계 카드 */
    .stat-card {
      background: var(--white); border: 2px solid var(--ink);
      border-radius: 14px; box-shadow: 4px 4px 0 var(--ink);
      padding: 16px 20px; display: flex; align-items: center; gap: 14px;
    }
    .stat-num {
      width: 42px; height: 42px; border: 2px solid var(--ink); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: 18px; font-weight: 800; flex-shrink: 0;
    }
    .stat-label { font-weight: 600; font-size: 13px; color: var(--ink); }

    /* 주간 네비게이터 */
    .week-nav {
      display: flex; align-items: center; gap: 0;
      border: 2px solid var(--ink); border-radius: 12px; overflow: hidden;
      background: var(--white); width: fit-content;
    }
    .week-nav-btn {
      display: flex !important; align-items: center !important; justify-content: center !important;
      width: 40px !important; height: 40px !important;
      background: var(--cream-dark) !important; border: none !important;
      border-right: 2px solid var(--ink) !important;
      font-size: 16px !important; cursor: pointer; transition: background .12s;
      flex-shrink: 0;
    }
    .week-nav-btn:last-child { border-right: none !important; border-left: 2px solid var(--ink) !important; }
    .week-nav-btn:hover { background: var(--yellow) !important; }
    .week-nav-label {
      padding: 0 20px; font-family: var(--font-display); font-size: 14px; font-weight: 700;
      white-space: nowrap; min-width: 200px; text-align: center;
    }
    .week-nav-sub { font-size: 11px; color: var(--ink-muted); font-weight: 400; display: block; margin-top: 1px; }

    /* 날짜 범위 */
    .date-range-wrap {
      display: flex; align-items: center; gap: 8px;
      border: 2px solid var(--ink); border-radius: 10px;
      padding: 6px 12px; background: var(--white);
    }
    .date-range-wrap input[type=date] {
      border: none !important; outline: none; background: transparent;
      font-size: 13px; font-family: inherit; color: var(--ink);
      padding: 0 !important;
    }
    .date-range-sep { color: var(--ink-muted); font-size: 12px; }

    /* 상태 필터 */
    .filter-btn {
      display: inline-flex !important; align-items: center !important;
      padding: 7px 16px !important; height: 36px !important;
      background: var(--white) !important; color: var(--ink) !important;
      border: 2px solid var(--ink) !important; border-radius: 10px !important;
      font-size: 12px !important; font-weight: 700 !important;
      cursor: pointer; font-family: var(--font-display) !important;
      transition: all 0.12s; white-space: nowrap;
    }
    .filter-btn.active { background: var(--orange) !important; color: #fff !important; box-shadow: 2px 2px 0 var(--ink); }
    .filter-btn:hover:not(.active) { background: var(--cream-dark) !important; }

    /* 이름 검색 */
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); pointer-events: none; }
    .search-input {
      width: 180px; background: var(--white); border: 2px solid var(--ink); border-radius: 10px;
      padding: 8px 12px 8px 34px; color: var(--ink); font-size: 13px;
      font-family: inherit; outline: none; transition: border-color 0.12s;
    }
    .search-input:focus { border-color: var(--orange); }

    /* 테이블 */
    .report-tbl { width: 100%; border-collapse: collapse; }
    .report-tbl thead th {
      background: var(--cream); font-family: var(--font-display); font-size: 11px; font-weight: 700;
      color: var(--ink-muted); padding: 10px 20px; text-transform: uppercase;
      letter-spacing: 0.07em; border-bottom: 2px solid var(--ink); text-align: left;
    }
    .report-tbl tbody tr.week-group-row td {
      background: var(--ink); color: #fff; padding: 8px 20px;
      font-family: var(--font-display); font-size: 12px; font-weight: 700;
      letter-spacing: 0.04em;
    }
    .report-tbl tbody tr.data-row { cursor: pointer; transition: background 0.12s; }
    .report-tbl tbody tr.data-row:hover td { background: var(--cream); }
    .report-tbl tbody td {
      padding: 14px 20px; font-size: 13px; border-bottom: 1.5px solid var(--cream-dark);
    }
    .author-cell { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; font-family: var(--font-display);
    }
    .num-cell { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--ink); }
    .status-pill {
      display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 99px;
      font-size: 11px; font-weight: 700; font-family: var(--font-display); border: 1.5px solid;
    }
    .pill-done   { background: #DCFCE7; color: #16A34A; border-color: #16A34A; }
    .pill-sub    { background: #DBEAFE; color: #1D6FE9; border-color: #1D6FE9; }
    .pill-reject { background: #FEE2E2; color: #DC2626; border-color: #DC2626; }
    .pill-new    { background: var(--yellow-light); color: #92400E; border-color: #D97706; }
    .action-btn {
      padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700;
      border: 1.5px solid; cursor: pointer; font-family: var(--font-display);
      transition: opacity .12s; white-space: nowrap;
    }
    .action-btn:hover { opacity: 0.75; }
    .action-approve { background: #DCFCE7; color: #16A34A; border-color: #16A34A; }
    .action-reject  { background: #FEE2E2; color: #DC2626; border-color: #DC2626; }
    .action-reset   { background: #DBEAFE; color: #1D6FE9; border-color: #1D6FE9; }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a class="topbar-logo" href="/index.html"><span class="logo-icon">📋</span> 주간업무보고 <span>보고서 목록</span></a>
    <span class="topbar-spacer"></span>
    <span class="topbar-user" id="topbar-user"></span>
    <button class="btn-logout" id="btn-logout">로그아웃</button>
  </header>
  <nav class="sidebar">
    <div class="sidebar-label">메뉴</div>
    <a class="sidebar-item" href="/index.html"><span class="sidebar-icon">📅</span> 팀 일정판</a>
    <a class="sidebar-item active" href="/report-list.html"><span class="sidebar-icon">📋</span> 보고서 목록</a>
    <a class="sidebar-item" href="/write.html"><span class="sidebar-icon">✏️</span> 보고서 작성</a>
    <a class="sidebar-item" href="/admin.html"><span class="sidebar-icon">⚙️</span> 사용자 관리</a>
    <a class="sidebar-item" href="/settings.html"><span class="sidebar-icon">🔗</span> Google Drive</a>
    <div class="sidebar-week">
      <div class="week-card">
        <div class="week-card-label">이번 주</div>
        <div class="week-card-title" id="week-card-title">—</div>
        <div class="week-card-range" id="week-card-range">—</div>
        <div class="week-progress">
          <div class="week-progress-bar"><div class="week-progress-fill" id="week-progress-fill" style="width:0%"></div></div>
          <span class="week-progress-text" id="week-progress-text">—</span>
        </div>
      </div>
    </div>
  </nav>
  <main class="main-content">
    <!-- 헤더 -->
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;">
      <div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
          <div class="page-icon" style="background:var(--orange);">📋</div>
          <h1 class="page-title">보고서 목록</h1>
        </div>
        <p class="page-sub" style="margin-left:42px;">팀원들의 주간 보고서를 확인하세요</p>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <button class="btn btn-secondary" id="btn-export" style="display:none;">📊 취합하기</button>
        <a href="/write.html" class="btn btn-primary">보고서 작성</a>
      </div>
    </div>

    <!-- 통계 카드 -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
      <div class="stat-card"><div class="stat-num" style="background:var(--yellow);" id="cnt-total">0</div><span class="stat-label">조회된 보고서</span></div>
      <div class="stat-card"><div class="stat-num" style="background:#DCFCE7;" id="cnt-done">0</div><span class="stat-label">검토완료</span></div>
      <div class="stat-card"><div class="stat-num" style="background:#DBEAFE;" id="cnt-sub">0</div><span class="stat-label">제출됨</span></div>
      <div class="stat-card"><div class="stat-num" style="background:#FEE2E2;" id="cnt-reject">0</div><span class="stat-label">반려됨</span></div>
    </div>

    <!-- 주간 네비게이터 + 필터 -->
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;">
      <!-- 주간 이동 -->
      <div class="week-nav">
        <button class="week-nav-btn" id="btn-prev-week" title="이전 주">‹</button>
        <div class="week-nav-label" id="week-nav-label">
          <span id="week-nav-title">—</span>
          <span class="week-nav-sub" id="week-nav-range">—</span>
        </div>
        <button class="week-nav-btn" id="btn-next-week" title="다음 주">›</button>
      </div>
      <!-- 이번 주로 -->
      <button class="filter-btn" id="btn-this-week">오늘</button>
      <!-- 날짜 직접 선택 -->
      <div class="date-range-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A8F7A" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <input type="date" id="date-from" />
        <span class="date-range-sep">~</span>
        <input type="date" id="date-to" />
        <button class="filter-btn" id="btn-date-search" style="border:none !important;background:var(--orange) !important;color:#fff !important;border-radius:6px !important;padding:3px 10px !important;height:auto !important;">검색</button>
      </div>
      <!-- 이름 검색 -->
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A8F7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M21 21l-4.35-4.35"/></svg>
        <input class="search-input" id="search-input" placeholder="이름 검색..." />
      </div>
    </div>

    <!-- 상태 필터 -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <span style="font-size:12px;color:var(--ink-muted);font-weight:600;">상태:</span>
      <button class="filter-btn active" data-filter="전체">전체</button>
      <button class="filter-btn" data-filter="검토완료">검토완료</button>
      <button class="filter-btn" data-filter="제출됨">제출됨</button>
      <button class="filter-btn" data-filter="반려됨">반려됨</button>
    </div>

    <!-- 테이블 -->
    <div class="card" style="padding:0;overflow:hidden;">
      <table class="report-tbl">
        <thead>
          <tr>
            <th>작성자</th>
            <th>보고 기간</th>
            <th>제출일</th>
            <th>업무</th>
            <th>Todo</th>
            <th>상태</th>
            <th id="th-action" style="display:none;">처리</th>
          </tr>
        </thead>
        <tbody id="report-tbody">
          <tr><td colspan="7" style="padding:32px;text-align:center;" class="text-muted">로딩 중...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
import { requireAuth, renderTopbarUser, logout, getUser, getToken } from '/js/auth.js';
import { api, showToast } from '/js/api.js';

requireAuth();
renderTopbarUser();
document.getElementById('btn-logout').addEventListener('click', logout);

const isAdmin = getUser()?.role === 'admin';
if (isAdmin) {
  document.getElementById('th-action').style.display = '';
  document.getElementById('btn-export').style.display = '';
}

const AVATAR_COLORS = ['#FD4401','#1D6FE9','#9333EA','#16A34A','#DB2777','#D97706'];
function avatarColor(name) {
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) & 0xffffffff;
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}

// ── 날짜 유틸 ────────────────────────────────────────
function toYMD(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getMonday(d) {
  const day = d.getDay() || 7;
  const m = new Date(d);
  m.setDate(d.getDate() - day + 1);
  m.setHours(0,0,0,0);
  return m;
}
function getFriday(mon) {
  const f = new Date(mon);
  f.setDate(mon.getDate() + 4);
  return f;
}
function getWeekLabel(mon) {
  let fd = new Date(mon.getFullYear(), mon.getMonth(), 1);
  while (fd.getDay() !== 1) fd.setDate(fd.getDate() + 1);
  const wn = Math.max(1, Math.round((mon - fd) / 604800000) + 1);
  return `${mon.getMonth()+1}월 ${wn}주차`;
}
function fmt(d) { return `${d.getMonth()+1}/${d.getDate()}`; }

// ── 상태 ─────────────────────────────────────────────
let allReports = [];
let currentFilter = '전체';
let viewMonday = getMonday(new Date()); // 현재 보고 있는 주 월요일
let customFrom = null, customTo = null; // 날짜 직접 선택 시
let useCustom = false;

// ── 주간 네비게이터 렌더 ─────────────────────────────
function updateWeekNav() {
  if (useCustom) {
    document.getElementById('week-nav-title').textContent = '날짜 선택';
    document.getElementById('week-nav-range').textContent = `${customFrom} ~ ${customTo}`;
  } else {
    const fri = getFriday(viewMonday);
    document.getElementById('week-nav-title').textContent = getWeekLabel(viewMonday);
    document.getElementById('week-nav-range').textContent = `${fmt(viewMonday)} ~ ${fmt(fri)}`;
  }
}

document.getElementById('btn-prev-week').addEventListener('click', () => {
  useCustom = false;
  viewMonday = new Date(viewMonday); viewMonday.setDate(viewMonday.getDate() - 7);
  updateWeekNav(); renderList();
});
document.getElementById('btn-next-week').addEventListener('click', () => {
  useCustom = false;
  viewMonday = new Date(viewMonday); viewMonday.setDate(viewMonday.getDate() + 7);
  updateWeekNav(); renderList();
});
document.getElementById('btn-this-week').addEventListener('click', () => {
  useCustom = false;
  viewMonday = getMonday(new Date());
  document.getElementById('date-from').value = '';
  document.getElementById('date-to').value = '';
  updateWeekNav(); renderList();
});
document.getElementById('btn-date-search').addEventListener('click', () => {
  const from = document.getElementById('date-from').value;
  const to   = document.getElementById('date-to').value;
  if (!from && !to) { useCustom = false; updateWeekNav(); renderList(); return; }
  useCustom = true;
  customFrom = from || '2000-01-01';
  customTo   = to   || '2099-12-31';
  updateWeekNav(); renderList();
});

document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  });
});
document.getElementById('search-input').addEventListener('input', renderList);

// ── 렌더 ─────────────────────────────────────────────
function getFilteredReports() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const fri = getFriday(viewMonday);
  const fromStr = useCustom ? customFrom : toYMD(viewMonday);
  const toStr   = useCustom ? customTo   : toYMD(fri);

  return allReports.filter(r => {
    const inRange = r.curr_start >= fromStr && r.curr_start <= toStr;
    const matchStatus = currentFilter === '전체' || r.status === currentFilter;
    const matchName = !q || r.author_name.toLowerCase().includes(q);
    return inRange && matchStatus && matchName;
  });
}

function renderList() {
  const filtered = getFilteredReports();
  const tbody = document.getElementById('report-tbody');
  const cols = isAdmin ? 7 : 6;

  // 통계 카드
  document.getElementById('cnt-total').textContent  = filtered.length;
  document.getElementById('cnt-done').textContent   = filtered.filter(r => r.status === '검토완료').length;
  document.getElementById('cnt-sub').textContent    = filtered.filter(r => r.status === '제출됨').length;
  document.getElementById('cnt-reject').textContent = filtered.filter(r => r.status === '반려됨').length;

  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="${cols}" style="padding:48px;text-align:center;" class="text-muted">해당 기간에 보고서가 없습니다</td></tr>`;
    return;
  }

  // 주별 그룹핑
  const groups = {};
  filtered.forEach(r => {
    const mon = getMonday(new Date(r.curr_start));
    const key = toYMD(mon);
    if (!groups[key]) groups[key] = { mon, reports: [] };
    groups[key].reports.push(r);
  });

  const sortedKeys = Object.keys(groups).sort((a,b) => b.localeCompare(a)); // 최신순

  let html = '';
  sortedKeys.forEach(key => {
    const { mon, reports } = groups[key];
    const fri = getFriday(mon);
    const label = getWeekLabel(mon);
    const range = `${fmt(mon)} ~ ${fmt(fri)}`;

    // 주 헤더
    html += `<tr class="week-group-row">
      <td colspan="${cols}">📅 ${label} &nbsp;<span style="font-weight:400;opacity:0.75;">${range}</span> &nbsp;<span style="opacity:0.6;">${reports.length}건</span></td>
    </tr>`;

    // 보고서 행
    reports.forEach(r => {
      const color = avatarColor(r.author_name);
      const pillClass = r.status === '검토완료' ? 'pill-done'
        : r.status === '제출됨' ? 'pill-sub'
        : r.status === '반려됨' ? 'pill-reject' : 'pill-new';
      const taskCount = (r.prev_support?.length || 0) + (r.curr_support?.length || 0);
      const todoCount = r.todo_items?.length || 0;
      html += `
        <tr class="data-row" onclick="location.href='/view.html?id=${r.id}'">
          <td>
            <div class="author-cell">
              <div class="avatar" style="background:${color};">${r.author_name[0]}</div>
              <div>
                <div style="font-weight:700;font-size:13px;">${r.author_name}</div>
                <div style="font-size:11px;color:var(--ink-muted);">${r.author_position||''}</div>
              </div>
            </div>
          </td>
          <td style="color:var(--ink-light);font-size:12px;">${r.curr_start} ~ ${r.curr_end}</td>
          <td style="font-size:12px;font-weight:600;">${(r.created_at||'').slice(5,10)}</td>
          <td><span class="num-cell">${taskCount}</span></td>
          <td><span class="num-cell">${todoCount}</span></td>
          <td><span class="status-pill ${pillClass}">${r.status||'제출됨'}</span></td>
          ${isAdmin ? `
          <td onclick="event.stopPropagation()" style="white-space:nowrap;">
            <div style="display:flex;gap:5px;flex-wrap:wrap;">
              ${r.status !== '검토완료' ? `<button class="action-btn action-approve" onclick="changeStatus(${r.id},'검토완료',event)">✅ 검토완료</button>` : ''}
              ${r.status !== '반려됨'  ? `<button class="action-btn action-reject"  onclick="changeStatus(${r.id},'반려됨',event)">❌ 반려</button>` : ''}
              ${r.status !== '제출됨'  ? `<button class="action-btn action-reset"   onclick="changeStatus(${r.id},'제출됨',event)">↩ 되돌리기</button>` : ''}
            </div>
          </td>` : ''}
        </tr>`;
    });
  });

  tbody.innerHTML = html;
}

window.changeStatus = async (id, status, e) => {
  e.stopPropagation();
  const labels = { '검토완료': '검토완료 처리', '반려됨': '반려', '제출됨': '제출됨으로 되돌리기' };
  if (!confirm(`이 보고서를 "${labels[status] || status}" 하시겠습니까?`)) return;
  try {
    await api.updateReport(id, { status });
    showToast('상태가 변경되었습니다');
    await load();
  } catch(err) { showToast(err.message); }
};

async function load() {
  allReports = await api.listReports(500);
  allReports = allReports.map(r => ({ ...r, status: r.status || '제출됨' }));
  renderList();
}

// ── 취합하기 (관리자 전용 Excel 다운로드) ─────────────
document.getElementById('btn-export')?.addEventListener('click', async () => {
  const btn = document.getElementById('btn-export');

  // 현재 조회 중인 주의 월요일 계산
  const mondayStr = useCustom
    ? (customFrom || toYMD(viewMonday))
    : toYMD(viewMonday);

  // 해당 주 보고서 건수 미리 안내
  const weekReports = allReports.filter(r => {
    const rm = toYMD(getMonday(new Date(r.curr_start)));
    return rm === toYMD(viewMonday);
  });
  const weekLabelTxt = document.getElementById('week-nav-title').textContent;

  if (!confirm(`${weekLabelTxt} 보고서 ${weekReports.length}건을 Excel로 취합하시겠습니까?`)) return;

  btn.disabled = true;
  btn.textContent = '⏳ 생성 중...';
  try {
    const res = await fetch(`/api/export/weekly?curr_start=${mondayStr}`, {
      headers: { Authorization: `Bearer ${getToken()}` }
    });
    if (!res.ok) {
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/json')) {
        const e = await res.json();
        throw new Error(e.detail || `서버 오류 (${res.status})`);
      }
      throw new Error(`서버 오류 (${res.status}) — FastAPI 콘솔을 확인하세요`);
    }
    // 파일 다운로드
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `주간보고_${weekLabelTxt}_${mondayStr}.xlsx`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Excel 파일이 다운로드되었습니다 📊');
  } catch(e) { showToast(e.message); }
  finally {
    btn.disabled = false;
    btn.textContent = '📊 취합하기';
  }
});

// ── 초기화 ───────────────────────────────────────────
updateWeekNav();
load().catch(e => showToast(e.message));

(function updateWeekCard() {
  const now = new Date();
  const day = now.getDay() || 7;
  const mon = new Date(now); mon.setDate(now.getDate() - day + 1);
  const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
  let _fd = new Date(mon.getFullYear(), mon.getMonth(), 1);
  while (_fd.getDay() !== 1) _fd.setDate(_fd.getDate() + 1);
  const weekNum = Math.max(1, Math.round((mon - _fd) / 604800000) + 1);
  const f = d => `${d.getMonth()+1}/${d.getDate()}`;
  document.getElementById('week-card-title').textContent = `${mon.getMonth()+1}월 ${weekNum}주차`;
  document.getElementById('week-card-range').textContent = `${f(mon)} – ${f(fri)}`;
  const wd = now.getDay();
  if (wd >= 1 && wd <= 5) {
    document.getElementById('week-progress-fill').style.width = Math.round((wd/5)*100)+'%';
    document.getElementById('week-progress-text').textContent = `${wd}/5일`;
  } else {
    document.getElementById('week-progress-fill').style.width = '0%';
    document.getElementById('week-progress-text').textContent = '—';
  }
})();
</script>
