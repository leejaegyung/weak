<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>보고서 — 주간업무보고</title>
  <link rel="stylesheet" href="/css/style.css?v=2" />
  <style>
    .report-wrap { max-width: 860px; }
    @media print { .report-wrap { max-width: 100%; } body { background: #fff; } }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a class="topbar-logo" href="/index.html">
      <span class="logo-icon">📋</span>
      주간업무보고
    </a>
    <span class="topbar-spacer"></span>
    <span class="topbar-user" id="topbar-user"></span>
    <button class="btn-logout" id="btn-logout">로그아웃</button>
  </header>
  <nav class="sidebar no-print">
    <div class="sidebar-label">메뉴</div>
    <a class="sidebar-item" href="/index.html"><span class="sidebar-icon">📅</span> 팀 일정판</a>
    <a class="sidebar-item" href="/report-list.html"><span class="sidebar-icon">📋</span> 보고서 목록</a>
    <a class="sidebar-item" href="/write.html"><span class="sidebar-icon">✏️</span> 보고서 작성</a>
    <a class="sidebar-item" href="/admin.html"><span class="sidebar-icon">⚙️</span> 사용자 관리</a>
    <a class="sidebar-item" href="/settings.html"><span class="sidebar-icon">🔗</span> Google Drive</a>
    <div class="sidebar-week">
      <div class="week-card">
        <div class="week-card-label">이번 주</div>
        <div class="week-card-title" id="week-card-title">—</div>
        <div class="week-card-range" id="week-card-range">—</div>
        <div class="week-progress">
          <div class="week-progress-bar"><div class="week-progress-fill" id="week-progress-fill" style="width:0%"></div></div>
          <span class="week-progress-text" id="week-progress-text">—</span>
        </div>
      </div>
    </div>
  </nav>
  <main class="main-content">
    <div id="report-body"><div class="text-muted">로딩 중...</div></div>
  </main>
</div>

<script type="module">
import { requireAuth, renderTopbarUser, logout, getUser, getToken } from '/js/auth.js';
import { api, showToast } from '/js/api.js';

requireAuth();
renderTopbarUser();
document.getElementById('btn-logout').addEventListener('click', logout);

const params = new URLSearchParams(location.search);
const reportId = params.get('id');
if (!reportId) location.href = '/report-list.html';

async function load() {
  const r = await api.getReport(reportId);
  const me = getUser();
  const canEdit = me.role === 'admin' || me.id === r.author_id;

  function renderItems(items) {
    if (!items.length) return '<span style="color:var(--ink-muted);font-style:italic;">없음</span>';
    return items.map((item, i) =>
      `<div style="margin-bottom:${i < items.length-1 ? '10px' : '0'};">` +
        `<strong style="display:block;">${i+1}. ${esc(item.title)}</strong>` +
        (item.content ? `<span style="white-space:pre-wrap;display:block;margin-top:2px;line-height:1.6;">${esc(item.content)}</span>` : '') +
      `</div>`
    ).join('');
  }

  const supportRows = `
    <tr>
      <td class="cat-cell">지원</td>
      <td class="content-cell" style="width:50%;vertical-align:top;">${renderItems(r.prev_support)}</td>
      <td class="content-cell" style="width:50%;vertical-align:top;">${renderItems(r.curr_support)}</td>
    </tr>`;

  const todoText = r.todo_items.length
    ? `<span style="white-space:pre-wrap;">${r.todo_items.map(t => `- ${esc(t.content)}`).join('\n')}</span>`
    : '';

  document.getElementById('report-body').innerHTML = `
    <div class="report-wrap">
      <div class="flex items-center justify-between no-print" style="margin-bottom:16px;">
        <a href="/report-list.html" class="btn btn-secondary btn-sm">← 목록</a>
        <div class="flex gap-2">
          <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨️ 인쇄</button>
          <button class="btn btn-secondary btn-sm" id="btn-drive-export">📤 Drive 저장</button>
          ${canEdit ? `<a href="/write.html?id=${r.id}" class="btn btn-secondary btn-sm">✏️ 수정</a>` : ''}
          ${me.role === 'admin' ? `
            <button class="btn btn-sm ${r.status === '검토완료' ? 'btn-secondary' : 'btn-primary'}" id="btn-status">
              ${r.status === '검토완료' ? '✅ 검토완료' : '검토완료 처리'}
            </button>
            <button class="btn btn-danger btn-sm" id="btn-delete">삭제</button>` : ''}
        </div>
      </div>

      <div class="card">
        <div class="report-header">
          <h2>주간업무보고</h2>
          <div class="report-meta-row">
            <span>전주 <strong>${r.prev_start} ~ ${r.prev_end}</strong></span>
            <span>금주 <strong>${r.curr_start} ~ ${r.curr_end}</strong></span>
            <span>이름 <strong>${r.author_name}</strong></span>
            <span>직급 <strong>${r.author_position}</strong></span>
          </div>
        </div>

        <table class="report-table">
          <thead>
            <tr>
              <th style="width:80px;">구분</th>
              <th>전주 업무 (${r.prev_start} ~ ${r.prev_end})</th>
              <th>금주 업무 (${r.curr_start} ~ ${r.curr_end})</th>
            </tr>
          </thead>
          <tbody>
            ${supportRows}
            <tr>
              <td class="cat-cell">todo<br><span style="font-size:10px;font-weight:400;">(일정미정)</span></td>
              <td class="content-cell" colspan="2">${todoText || '<span style="color:var(--ink-muted);font-style:italic;">없음</span>'}</td>
            </tr>
            <tr>
              <td class="cat-cell">내부작업</td>
              <td class="content-cell" colspan="2">${r.internal_work ? `<span style="white-space:pre-wrap;">${esc(r.internal_work)}</span>` : '<span style="color:var(--ink-muted);font-style:italic;">없음</span>'}</td>
            </tr>
            <tr>
              <td class="cat-cell">공유</td>
              <td class="content-cell" colspan="2">${r.shared ? `<span style="white-space:pre-wrap;">${esc(r.shared)}</span>` : '<span style="color:var(--ink-muted);font-style:italic;">없음</span>'}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById('btn-drive-export')?.addEventListener('click', async () => {
    const btn = document.getElementById('btn-drive-export');
    btn.disabled = true; btn.textContent = '저장 중...';
    try {
      const res = await fetch(`/api/drive/export/report/${r.id}`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${getToken()}` },
      });
      if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.detail||'오류'); }
      const { url } = await res.json();
      showToast('Google Sheets로 저장되었습니다!');
      window.open(url, '_blank');
    } catch(e) { showToast(e.message); }
    finally { btn.disabled = false; btn.textContent = '📤 Drive 저장'; }
  });

  document.getElementById('btn-status')?.addEventListener('click', async () => {
    const newStatus = r.status === '검토완료' ? '제출됨' : '검토완료';
    try {
      await api.updateReport(r.id, { status: newStatus });
      showToast(newStatus === '검토완료' ? '검토완료로 변경되었습니다' : '제출됨으로 변경되었습니다');
      setTimeout(() => location.reload(), 500);
    } catch(e) { showToast(e.message); }
  });

  document.getElementById('btn-delete')?.addEventListener('click', async () => {
    if (!confirm('이 보고서를 삭제하시겠습니까?')) return;
    try {
      await api.deleteReport(r.id);
      showToast('삭제되었습니다');
      setTimeout(() => location.href = '/report-list.html', 500);
    } catch(e) { showToast(e.message); }
  });
}

function esc(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

load().catch(e => showToast(e.message));

(function updateWeekCard() {
  const now = new Date();
  const day = now.getDay() || 7;
  const mon = new Date(now); mon.setDate(now.getDate() - day + 1);
  const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
  let _fd = new Date(mon.getFullYear(), mon.getMonth(), 1);
  while (_fd.getDay() !== 1) _fd.setDate(_fd.getDate() + 1);
  const weekNum = Math.max(1, Math.round((mon - _fd) / 604800000) + 1);
  const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
  document.getElementById('week-card-title').textContent = `${mon.getMonth()+1}월 ${weekNum}주차`;
  document.getElementById('week-card-range').textContent = `${fmt(mon)} – ${fmt(fri)}`;
  const wd = now.getDay();
  if (wd >= 1 && wd <= 5) {
    const pct = Math.round((wd / 5) * 100);
    document.getElementById('week-progress-fill').style.width = pct + '%';
    document.getElementById('week-progress-text').textContent = `${wd}/5일`;
  } else {
    document.getElementById('week-progress-fill').style.width = '0%';
    document.getElementById('week-progress-text').textContent = '—';
  }
})();
</script>
</body>
</html>
