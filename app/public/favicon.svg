<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001b44;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003080;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 배경 (둥근 모서리) -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#bg)"/>
  <!-- S 글자 -->
  <text
    x="5.5"
    y="22"
    font-family="'Space Grotesk', 'Manrope', Arial, sans-serif"
    font-size="16"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="-0.5"
  >SE</text>
  <!-- 하단 강조 바 -->
  <rect x="5.5" y="25.5" width="21" height="2" rx="1" fill="#4A9EFF" opacity="0.85"/>
